# Multi-task RoboTwin client config.
# Usage:
#   bash evaluation/robotwin/launch_client_multigpus.sh
# or:
#   bash evaluation/robotwin/launch_client_multigpus.sh --config evaluation/config/robotwin_client_multigpu.yaml

save_root: "results/"
task_group_id: 0
seed: 0
test_num: 100

policy_name: "ACT"
task_config: "demo_clean"
train_config_name: 0
model_name: 0

start_port: 29556
num_gpus: 8
video_guidance_scale: 5
action_guidance_scale: 1
online_scheduler_mode: "fixed"
fixed_video_steps: 25
enable_hazard_scheduler_runtime: false
hazard_checkpoint_path: ""
hazard_eta: 0.5
hazard_k_min: 3
hazard_k_max: 25
hazard_feature_source: "cond"
hazard_return_metadata: true
save_debug_artifacts: true

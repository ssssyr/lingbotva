launcher:
  config_name: robotwin_hazard_train
  ngpu: 4
  master_port: 29522
  log_rank: 0
  torchft_lighthouse: http://localhost:29510
  force_attn_mode: torch

paths:
  train_model_path: /cpfs01/projects-HDD/cfff-4a2485d4a88d_HDD/ct_24210860031/812/SYR/models/lingbot-va-posttrain-robotwin
  dataset_path: /home/ct_24210860031/812/SYR/datasets/robotwin-clean-and-aug-lerobot
  save_root: /cpfs01/projects-HDD/cfff-4a2485d4a88d_HDD/ct_24210860031/812/SYR/code/lingbot-va/train_out/robotwin_hazard_4gpu
  reference_model_path: /cpfs01/projects-HDD/cfff-4a2485d4a88d_HDD/ct_24210860031/812/SYR/models/lingbot-va-posttrain-robotwin

logging:
  enable_wandb: false
  wandb_project: va_robotwin_hazard
  wandb_team_name: ""
  wandb_base_url: ""
  wandb_api_key: ""

model:
  enable_action_residual_adapter: false
  action_adapter_dim: 256
  action_adapter_dropout: 0.0
  # Hazard scheduler config
  enable_hazard_scheduler: true
  hazard_hidden_dim: 512
  hazard_K_max: 10

trainable:
  # Freeze transformer during Hazard training
  freeze_backbone: true
  freeze_embeddings: true
  train_action_adapter: false
  train_action_head: false
  train_video_heads: false
  train_time_embedder: false
  # Only train Hazard scheduler
  train_hazard_scheduler: true

training:
  load_workers: 16
  init_workers: 8
  save_interval: 1000
  gc_interval: 50
  cfg_prob: 0.0  # No CFG during Hazard training
  batch_size: 1  # CRITICAL: Must be 1 for current HazardScheduler (per-sample rollout)
  gradient_accumulation_steps: 1
  num_steps: 10000

# Hazard-specific training config
hazard:
  baseline_Ks: [5, 10, 15, 20, 25]
  policy_variant: stop_jump_v2
  optimizer_mode: ppo
  learning_rate: 1e-4
  lambda_cost: 0.1  # Cost penalty for video steps
  lambda_kl: 0.01  # KL regularization
  baseline_K: 10  # Fixed K for baseline
  kl_reference_K: 25
  K_min: 3  # Minimum steps before allowing stop
  eta: 0.8  # Stopping threshold for deterministic inference
  sigma_min: 0.01
  jump_parameterization: mode_concentration
  jump_relative: true
  jump_ref_concentration: 20.0
  heuristic_jump_mode: 0.75
  heuristic_jump_concentration: 10.0
  ppo_num_epochs: 4
  cliprange: 0.2
  jump_logprob_scale: 0.3
  advantage_normalize: true
  rloo_k: 1
  use_rloo: false
  reward_adv_baseline: ema
  reward_ema_decay: 0.95
  reward_anchor_lo_k: 4
  reward_anchor_hi_k: 25
  reward_skip_initial_action_frames: 1
  reward_w_seq: 0.7
  reward_w_delta: 0.3
  reward_lambda_neg: 1.0
  reward_lambda_c: 0.4
  reward_pos_weight: 1.0
  reward_rot_weight: 0.6
  reward_gripper_weight: 0.8
  reward_delta_pos_weight: 1.0
  reward_delta_rot_weight: 0.2
  reward_delta_gripper_weight: 0.6
  reward_gap_epsilon: 1e-4
  reward_difficulty_kappa: 0.1
  reward_time_rho: 0.08
  reward_time_eta_motion: 0.6
  reward_time_eta_gripper: 1.2
  reward_time_eta_early: 0.0
  reward_cost_c0: 0.2
  reward_cost_c1: 0.0
  reward_cost_gamma: 2.0
  log_interval: 10
  save_interval: 1000
